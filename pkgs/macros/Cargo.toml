[package]
name = "shellx_macros"
version = "0.6.0"
edition = "2024"
description = "Compile-time markup macros for shellx"
license = "MIT"
repository = "https://github.com/kossnocorp/shellx"

[lib]
proc-macro = true

[dependencies]
shellx_core = { path = "../core", version = "0.6.0" }
proc-macro2 = "1"
quote = "1"
syn = "2"
